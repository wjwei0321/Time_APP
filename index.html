<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#F6F2EE">
<script>
/* apply saved theme before first paint to avoid a flash */
(function () { var u = {}; try { u = JSON.parse(localStorage.getItem('shiti.ui.v1')) || {}; } catch (e) {}
  var r = document.documentElement, h = r.getAttribute('data-theme'), m = u.mode || 'auto';
  if (m === 'auto') m = h === 'dark' || h === 'light' ? h : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-mode', m); })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時序">
<meta name="description" content="時序：每段時間都有它的抽屜，時間到了打開，抽屜之間留白。">
<title>時序</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
html{
  --kai:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB",serif;
  --num:system-ui,-apple-system,"SF Pro Display","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
/* 單一色系「長流橘」（與長流、細水同一個橘）× 白天／夜晚，預設跟系統。
   覆盆子紅＝超量／流失，金色＝用心留白（偏黃褐，和橘色主色分得開） */
html[data-mode="light"]{--vermilion:#C8234A;--vermilion-soft:#F9DDE3;--gold:#9A7522;--gold-soft:#F1E7CC;--scrim:rgba(28,18,10,.42);color-scheme:light;
  --t-moss:#5E7F3A;--t-amber:#9A7522;--t-slate:#4E6385;--t-plum:#7D4F7A;--t-ink:#5B6470;--t-sky:#2E7DA1;--t-rose:#B0507A;--shade:rgba(20,30,28,.16)}
html[data-mode="dark"]{--vermilion:#FF6F8A;--vermilion-soft:#3A1A22;--gold:#DDBB62;--gold-soft:#30291A;--scrim:rgba(0,0,0,.55);color-scheme:dark;
  --t-moss:#A8C77E;--t-amber:#DDBB62;--t-slate:#9DB2D8;--t-plum:#CFA0CB;--t-ink:#AEB6C0;--t-sky:#8EC9E6;--t-rose:#E7A2BE;--shade:rgba(0,0,0,.5)}
html[data-mode="light"]{
  --paper:#F6F2EE;--surface:#FFFFFF;--surface-2:#F0E7DF;--ink:#2A1F17;--ink-2:#6A5A4D;--ink-3:#8A7A6D;--line:#E8DED5;
  --pool:#EA6A16;--pool-ink:#FFFFFF;--pool-soft:#FFE9D8;--celadon:#FFD3AE;--celadon-2:#F9A66A}
html[data-mode="dark"]{
  --paper:#17120E;--surface:#201913;--surface-2:#2A2119;--ink:#F2E9E1;--ink-2:#BFAF9F;--ink-3:#93857A;--line:#352A20;
  --pool:#FF8A3D;--pool-ink:#17120E;--pool-soft:#3A2414;--celadon:#7A3A12;--celadon-2:#5E2C0E}
html{--t-pool:var(--pool)}
[data-tone^="pool"]{--tone:var(--pool)} [data-tone^="moss"]{--tone:var(--t-moss)} [data-tone^="amber"]{--tone:var(--t-amber)}
[data-tone^="slate"]{--tone:var(--t-slate)} [data-tone^="plum"]{--tone:var(--t-plum)} [data-tone^="ink"]{--tone:var(--t-ink)}
[data-tone^="sky"]{--tone:var(--t-sky)} [data-tone^="rose"]{--tone:var(--t-rose)}
[data-tone]{--tone-soft:color-mix(in srgb,var(--tone) 14%,var(--surface))}
/* 外框款（色名後加 -o）：白底＋同色外框 */
[data-tone$="-o"]{--tone-soft:var(--surface)}
[data-tone$="-o"] .ico,.ico[data-tone$="-o"],[data-tone$="-o"] .ebtn{box-shadow:inset 0 0 0 1.5px var(--tone)}
.ribbon i[data-tone$="-o"],.wk .col i[data-tone$="-o"],.wkc .col i[data-tone$="-o"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--tone)}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100dvh;transition:background-color .3s}
::selection{background:color-mix(in srgb,var(--pool) 28%,transparent)}
input,textarea{caret-color:var(--pool)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--pool);outline-offset:2px;border-radius:8px}
.num,.big,.tm,.pct{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum"}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.ti{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}

#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(112px + env(safe-area-inset-bottom))}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.head h1{font-family:var(--kai);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:.02em}
.head .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.head-r{display:flex;gap:8px;align-items:center}
.gear{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:none}
.gear .ti{width:19px;height:19px}
.gear{position:relative}
.gear[data-st="err"]::after{content:"";position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--vermilion);border:2px solid var(--paper)}
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.sync-dot i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync-dot[data-st="ok"] i{background:#3BA57F} .sync-dot[data-st="busy"] i{background:var(--gold);animation:pulse 1s infinite} .sync-dot[data-st="err"] i{background:var(--vermilion)}
@keyframes pulse{50%{opacity:.3}}
.sync-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:600;letter-spacing:.1em;color:var(--pool)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--pool);font-size:15px;margin:0 0 6px -6px;padding:4px 6px}

/* ── 此刻的抽屜（主視覺）──────────────────────── */
.now{position:relative}
.face{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:20px 22px 26px;transition:background-color .3s}
.f-top{display:flex;align-items:center;gap:12px}
.f-top .ico{width:44px;height:44px;border-radius:15px}
.f-when{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.f-when .dot{width:7px;height:7px;border-radius:50%;background:var(--tone)}
.f-name{font-family:var(--kai);font-size:27px;font-weight:700;line-height:1.15;letter-spacing:.02em}
.f-left{display:flex;align-items:baseline;gap:4px;margin:18px 0 0}
.f-left .big{font-size:64px;line-height:.95;font-weight:650;letter-spacing:-.02em}
.f-left .u{font-size:17px;color:var(--ink-2);margin-right:6px}
.f-sub{font-size:14px;color:var(--ink-2);margin-top:8px}
/* 水位：抽屜還剩多少時間（沿用細水長流的水位動態） */
.f-liq{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;pointer-events:none}
.face > :not(.f-liq):not(.pull){position:relative;z-index:1}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 18%,var(--surface)) 0%,color-mix(in srgb,var(--tone) 30%,var(--surface)) 100%);transition:height 1.3s cubic-bezier(.2,.85,.2,1)}
.wave{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:14px;animation:drift 8s linear infinite}
.wave.back{animation-duration:13s;animation-direction:reverse;bottom:calc(100% + 2px)}
.f-liq .wave path{fill:color-mix(in srgb,var(--tone) 18%,var(--surface))}
.f-liq .wave.back path{fill:color-mix(in srgb,var(--tone) 10%,var(--surface))}
@keyframes drift{to{transform:translateX(-50%)}}
/* 把手：抽屜面板與內盒的接縫 */
.pull{position:absolute;z-index:3;left:50%;bottom:-6px;width:68px;height:12px;margin-left:-34px;border-radius:9px;background:var(--tone);box-shadow:0 3px 6px -2px var(--shade)}
.tray{position:relative;z-index:1;margin:-18px 12px 0;padding:30px 6px 8px;border-radius:0 0 26px 26px;background:color-mix(in srgb,var(--tone) 8%,var(--surface-2));box-shadow:inset 0 16px 14px -14px var(--shade)}
.tray.opening{animation:pull-out .7s var(--ease) both}
.tray.opening .it{animation:rise .5s var(--ease) both}
.tray.opening .it:nth-child(2){animation-delay:.06s} .tray.opening .it:nth-child(3){animation-delay:.12s} .tray.opening .it:nth-child(4){animation-delay:.18s} .tray.opening .it:nth-child(n+5){animation-delay:.24s}
@keyframes pull-out{from{clip-path:inset(0 0 100% 0 round 0 0 26px 26px);transform:translateY(-22px)}to{clip-path:inset(0 0 0 0 round 0 0 26px 26px);transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tray-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);padding:0 12px 4px}
.tray .add-in{display:flex;align-items:center;gap:8px;width:100%;padding:12px;color:var(--pool);font-size:14px;border-radius:14px}
.tray .add-in .ti{width:18px;height:18px}
.tray .note{padding:4px 12px 10px}
/* 留白：沒有抽屜的空檔，結構與抽屜相同，只換成留白的顏色 */
.now.gap{--tone:var(--gold);--tone-soft:var(--gold-soft)}
.tray-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 6px 4px}
.tbtn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink)}
.tbtn .ti{width:17px;height:17px;color:var(--tone)}
.tbtn.on{background:var(--gold-soft);border-color:transparent;color:var(--gold);font-weight:600}
.tbtn:active{transform:scale(.98)}
.tray-h + .it,.it + .tray-h{margin-top:0}
.tray .it + .tray-h{margin-top:8px}
.now.night .face{background:var(--surface-2);border-color:transparent}
.now.night .pull{display:none}
.chosen{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:5px 12px;margin-top:12px}
.chosen .ti{width:16px;height:16px}

/* items */
.it{position:relative;border-radius:14px;overflow:hidden;touch-action:pan-y}
.it-row{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:9px 12px;width:100%;text-align:left;background:inherit;transition:transform .22s var(--ease)}
.tray .it-row{background:transparent}
.it.drag .it-row{transition:none}
.it-del{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:var(--vermilion);color:#fff;border-radius:14px;opacity:0;transition:opacity .15s}
.it.drag .it-del{opacity:1}
.it-del .ti{width:20px;height:20px}
.tray .it-row,.rows .it-row{background:var(--surface)}
.tray .it-row{background:transparent}
.tray .it.drag .it-row{background:color-mix(in srgb,var(--tone) 8%,var(--surface-2))}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:1.6px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background-color .18s,border-color .18s,transform .18s}
.ck .ti{width:16px;height:16px;stroke-width:2.6}
.ck.on{background:var(--tone,var(--pool));border-color:var(--tone,var(--pool));color:var(--surface)}
.ck.pop{animation:pop .32s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}
.it .mid{flex:1;min-width:0}
.it .t{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.it .s{font-size:12px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.it.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 60%,transparent)}
.it .mins{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* blocks */
.block{margin-top:30px}
.block > h2{font-family:var(--kai);font-size:19px;font-weight:700;margin:0 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.block > h2 .lk{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--pool);padding:4px 2px}
.block > h2 small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);text-align:right}
.panel{background:var(--surface);border-radius:22px;padding:18px;border:1px solid var(--line)}
.panel + .panel{margin-top:10px}
.rows{background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.rows .it{border-radius:0}
.rows .it-del{border-radius:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
button.row:active{background:var(--surface-2)}
.row .mid{flex:1;min-width:0}
.mid > .t,.mid > .s{display:block}
.cd .s{display:flex!important}
.row .t{font-size:15px;line-height:1.3}
.row .s{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:1px}
.ico{width:40px;height:40px;flex:none;border-radius:14px;background:var(--tone-soft,var(--pool-soft));color:var(--tone,var(--pool));display:grid;place-items:center}
.chev{color:var(--ink-3)}
.chev .ti{width:18px;height:18px}
.note{font-size:13px;color:var(--ink-2);line-height:1.6}
.big-line{font-size:15px;line-height:1.65}
.big-line strong{white-space:nowrap;font-weight:650;font-family:var(--num);font-variant-numeric:tabular-nums}
.pill{white-space:nowrap;display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;font-weight:500}
.pill.hot{background:var(--vermilion-soft);color:var(--vermilion)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--pool-soft);color:var(--pool)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.chip .ti{width:16px;height:16px}
.chip.on{background:var(--pool);color:var(--pool-ink);border-color:var(--pool);font-weight:600}
.chip.tone.on{background:var(--tone);border-color:var(--tone);color:var(--surface)}
.chip.streak{background:var(--gold-soft);border-color:transparent;color:var(--ink)}
.chip.streak .ti{color:var(--gold)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.scroll-x::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:5px 13px;border-radius:999px;font-size:13px;color:var(--ink-2);transition:background-color .2s,color .2s}
.seg button.on{background:var(--pool);color:var(--pool-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg-ic button{display:grid;place-items:center;width:44px;height:32px;padding:0}.seg-ic svg{width:18px;height:18px}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;padding:8px 6px;font-size:14px}

/* check-in */
.ask{margin-top:12px;padding:16px 16px 14px}
.ask-q{font-family:var(--kai);font-size:18px;line-height:1.4}
.ask-q + .s{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.ask .chips{gap:6px}
.ask .chip{height:38px}
.ask .chip.leak{color:var(--vermilion)}
.ask{position:relative}
.ask .skip{position:absolute;top:10px;right:10px;font-size:13px;color:var(--ink-3);padding:6px 8px}
.ask .ask-q{padding-right:44px}

/* 今天的節奏：一條橫向的日帶 */
.ribbon{position:relative;height:34px;border-radius:12px;background:var(--surface-2)}
.ribbon i{position:absolute;top:4px;bottom:4px;border-radius:6px;background:var(--tone)}
.ribbon i.past{opacity:.38}
.ribbon .nowl{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.rib-ax{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--ink-3)}
.rib-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rib-ax span:first-child{transform:none} .rib-ax span:last-child{transform:translateX(-100%)}
.meter .big-line{margin-top:12px}
.meter .pill{margin-left:4px}

/* 今天的櫃子 */
.cab{display:flex;flex-direction:column}
.cseg{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.cseg .tm{font-size:12px;color:var(--ink-3);text-align:right;padding-top:15px;line-height:1}
.cd{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:4px 0;padding:12px 30px 12px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .3s}
.cd::after{content:"";position:absolute;right:12px;top:50%;width:5px;height:24px;margin-top:-12px;border-radius:5px;background:color-mix(in srgb,var(--tone) 45%,var(--surface-2))}
.cd .t{font-size:15px;line-height:1.3;font-weight:500}
.cd .s{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cd.cur{transform:translateX(10px);border-color:transparent;box-shadow:0 10px 22px -12px var(--shade),0 2px 6px -3px var(--shade)}
.cd.cur::after{background:var(--tone)}
.cd.past{opacity:.62}
.cd:active{transform:scale(.985)}
.cd.cur:active{transform:translateX(10px) scale(.985)}
.cgap{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;text-align:left;margin:3px 0;padding:6px 14px;border:1.5px dashed var(--line);border-radius:14px;font-size:12px;color:var(--ink-3);min-height:28px;transition:border-color .2s,background-color .2s}
.cgap:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.cgap .g-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cgap .g-l{display:flex;align-items:center;gap:6px}
.cgap .gadd{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:600}
.cgap .gadd .ti{width:13px;height:13px;stroke-width:2.2}
.gps{display:flex;flex-wrap:wrap;gap:6px}
.gp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.gp b{color:var(--gold);font-weight:600}
.gp.done{color:var(--ink-3);text-decoration:line-through}
.cgap.cur{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));color:var(--gold);background:color-mix(in srgb,var(--gold-soft) 50%,transparent)}
.cgap.leak{color:var(--vermilion)} .cgap.rest{color:var(--gold)}
.cgap .ti{width:14px;height:14px}
.cend .tm{padding-top:4px}
.cend .lbl{font-size:12px;color:var(--ink-3);padding-top:3px}

/* close the day */
.close-card{margin-top:12px}
.close-card .ask-q{margin-bottom:4px}
.close-card .rows{margin-top:12px}
.mini-acts{display:flex;gap:6px;flex:none}
.mini-acts button{height:32px;padding:0 10px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.mini-acts button.go{background:var(--pool-soft);color:var(--pool);font-weight:600}

/* drawers tab: 一週的櫃子（左側時間刻度＋七個欄位） */
.wkc{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));column-gap:6px}
.wcol,.ax-col{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.wkc .dh{height:34px;display:grid;place-items:center}
.wkc .dh b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:15px;font-weight:600;color:var(--ink)}
.wcol.today .dh b{background:var(--pool);color:var(--pool-ink)}
.wkc .col{position:relative;height:190px;border-radius:10px;background:var(--surface-2);overflow:hidden;transition:box-shadow .2s}
.wkc .col i{position:absolute;left:3px;right:3px;border-radius:5px;background:var(--tone);min-height:3px}
.wkc .col .gl{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--ink-3) 40%,transparent)}
.wcol.sel .col{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--pool)}
.wcol:active .col{transform:scale(.98)}
.ax-col .ax{position:relative;height:190px}
.ax-col .ax span{position:absolute;right:0;transform:translateY(-50%);font-size:10px;color:var(--ink-3);font-family:var(--num);font-variant-numeric:tabular-nums}
.ax-col .ax span:first-child{transform:none} .ax-col .ax span:last-child{transform:translateY(-100%)}
.wkc .ft{height:30px;display:grid;place-items:center}
.wkc .pct{font-size:12px;font-weight:650;color:var(--ink-2);font-family:var(--num);font-variant-numeric:tabular-nums}
.wkc .pct.hot{color:var(--vermilion)}
.wk-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.wk-legend > span{display:inline-flex;align-items:center;gap:6px}
.wk-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.wk-legend .cap{margin-left:auto;color:var(--ink)}
.wk-legend .cap b{font-weight:650}
.wk-legend .lk{color:var(--pool);font-size:13px;padding:2px 0 2px 6px}
.dgroup{margin-top:20px}
.dgroup h3{font-family:var(--kai);font-size:17px;font-weight:700;color:var(--ink);margin:0 4px 10px;display:flex;align-items:center;gap:7px}
.dgroup h3 .ti{width:18px;height:18px;color:var(--ink-3)}
.dgroup h3 small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3)}
.drow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:transform .15s}
.drow + .drow{margin-top:8px}
.drow:active{transform:scale(.99)}
.drow .tt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding-right:10px;border-right:1px solid var(--line)}
.drow .tt b{font-family:var(--num);font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink)}
.drow .tt span{font-family:var(--num);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:3px}
.drow .nm{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
.drow .nm .ico{width:28px;height:28px;border-radius:9px}
.drow .nm .ico .ti{width:17px;height:17px}
.drow .dd{display:flex;gap:3px;margin-top:8px}
.drow .dd i{width:19px;height:19px;border-radius:6px;font-style:normal;font-size:10px;display:grid;place-items:center;color:var(--ink-3);background:var(--surface-2)}
.drow .dd i.on{background:var(--tone);color:var(--surface);font-weight:700}
.drow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.drow .rt .len{font-size:13px;color:var(--ink-2);font-family:var(--num);font-weight:600;white-space:nowrap}
.drow .rt .pill{margin-left:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wk button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wk .col{position:relative;width:100%;height:150px;border-radius:12px;background:var(--surface-2);overflow:hidden;transition:box-shadow .2s}
.wk .col i{position:absolute;left:4px;right:4px;border-radius:4px;background:var(--tone);min-height:3px}
.wk .d{font-size:13px;color:var(--ink-2)}
.wk .p{font-size:11px;color:var(--ink-3)}
.wk .p.hot{color:var(--vermilion);font-weight:600}
.wk .today .d{color:var(--ink);font-weight:700}
.wk .sel .col{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--pool)}
.wk-note{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:10px 2px 0}

/* review */
.say{font-family:var(--kai);font-size:21px;line-height:1.6}
.say b{white-space:nowrap;font-family:var(--num);font-weight:650;font-variant-numeric:tabular-nums;font-size:.95em}
.say .k-leak{color:var(--vermilion)} .say .k-rest{color:var(--gold)} .say .k-plan{color:var(--pool)}
.stack{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:6px}
.stack .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.stack .bar{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.stack .bar i{display:block;width:100%;border-radius:4px;transition:height .5s var(--ease)}
.stack .c span{font-size:11px;color:var(--ink-3);line-height:1}
.stack .c.today span{color:var(--ink);font-weight:700}
.k-plan-bg{background:var(--pool)} .k-rest-bg{background:var(--gold)} .k-other-bg{background:color-mix(in srgb,var(--ink-3) 55%,var(--surface-2))} .k-leak-bg{background:var(--vermilion)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hours{display:grid;gap:3px;margin-top:4px}
.hours i{display:block;height:30px;border-radius:6px;background:var(--surface-2)}
.hours-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}
.an-row{display:flex;gap:12px;align-items:center;padding:12px 16px}
.an-row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.an-row .kv{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.an-track{display:block;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.an-track i{display:block;height:100%;border-radius:99px;background:var(--tone)}
.ins p{font-size:14px;line-height:1.65}
.ins p + p{margin-top:8px}
.ins p .ti{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--pool)}
.stat-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* empty */
.empty{text-align:center;padding:30px 18px;color:var(--ink-2);font-size:14px;line-height:1.7}
.empty .e-big{font-family:var(--kai);font-size:20px;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:16px}

/* tab bar */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--paper);z-index:19;pointer-events:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:64px}
.tabs .tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-3);padding:6px 0;transition:color .2s}
.tabs .tb .ti{width:23px;height:23px}
.tabs .tb.on{color:var(--pool);font-weight:600}
.fab{justify-self:center;width:62px;height:62px;border-radius:24px;background:var(--pool);color:var(--pool-ink);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 8px 20px -6px color-mix(in srgb,var(--pool) 70%,transparent);transition:transform .15s}
.fab:active{transform:translateY(-14px) scale(.94)}
.fab .ti{width:28px;height:28px;stroke-width:2.4}

/* sheets */
/* 關閉時連底色一起拿掉並隱藏：iOS Safari 會拿全螢幕固定元素的底色去染頂部狀態列，透明度 0 也會被取樣 */
.scrim{position:fixed;inset:0;background:transparent;visibility:hidden;pointer-events:none;transition:background-color .28s,visibility 0s .28s;z-index:71}
.scrim.open{background:var(--scrim);visibility:visible;pointer-events:auto;transition:background-color .28s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .38s var(--ease);z-index:72;padding:0 16px calc(18px + env(safe-area-inset-bottom));scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.open{transform:none}
.sheet:not(.open){visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
.grab{display:block;width:100%;padding:10px 0 8px;position:sticky;top:0;background:var(--paper);z-index:2}
.grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.sh-head h3{font-family:var(--kai);font-size:22px;font-weight:700;flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:18px;background:var(--pool);color:var(--pool-ink);font-size:16px;font-weight:600;transition:transform .1s,background-color .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--vermilion-soft);color:var(--vermilion)}
.btn .ti{width:20px;height:20px}
.btn + .btn{margin-top:10px}
.two-btn{display:flex;gap:10px} .two-btn > *{flex:1} .two-btn .btn + .btn{margin-top:0}
.field{display:block;margin-top:16px}
.field > span{display:block;font-size:13px;color:var(--ink-2);margin:0 4px 7px}
.input{width:100%;height:50px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;font-size:17px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--pool)}
.input::placeholder{color:var(--ink-3)}
.input.kai{font-family:var(--kai);font-size:21px;font-weight:700}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.times .input{font-family:var(--num);font-size:19px;padding:0 8px;text-align:center;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.times .input::-webkit-calendar-picker-indicator{display:none}
.times .input::-webkit-datetime-edit{padding:0;flex:none}
.times .to{color:var(--ink-3);font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--ink-2)}
.days button.on{background:var(--tone,var(--pool));border-color:transparent;color:var(--surface);font-weight:600}
.tones{display:grid;grid-template-columns:repeat(8,minmax(0,34px));gap:12px 10px;justify-content:start}
.tones button{width:100%;aspect-ratio:1;border-radius:50%;background:var(--tone);box-shadow:0 0 0 1px var(--line)}
.tones button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.tones button[data-tone$="-o"]{background:var(--surface);box-shadow:inset 0 0 0 3px var(--tone)}
.tones button[data-tone$="-o"].on{box-shadow:inset 0 0 0 3px var(--tone),0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-height:200px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;scrollbar-width:none}
.igrid button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.igrid button.on{background:var(--tone);color:var(--surface)}
.dr-head{display:flex;gap:10px;align-items:center}
.dr-head .ebtn{width:56px;height:56px;border-radius:18px;flex:none;background:var(--tone-soft);color:var(--tone);display:grid;place-items:center}
.dr-head .ebtn .ti{width:28px;height:28px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.checks p{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;padding:9px 12px;border-radius:12px}
.checks p .ti{width:17px;height:17px;margin-top:1px}
.checks .hot{background:var(--vermilion-soft);color:var(--vermilion)}
.checks .warn{background:var(--gold-soft);color:var(--gold)}
.checks .ok{background:var(--pool-soft);color:var(--pool)}
.qa-in{display:flex;gap:8px;align-items:center}
.qa-in .input{flex:1;min-width:0}
.mic{width:50px;height:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--pool);flex:none;position:relative}
.mic.on{background:var(--pool);color:var(--pool-ink);border-color:var(--pool)}
.mic.on::before{content:"";position:absolute;inset:-6px;border-radius:20px;border:2px solid var(--pool);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.94);opacity:.7}to{transform:scale(1.16);opacity:0}}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:0}
.pc{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;background:var(--pool-soft);color:var(--ink);font-size:13px}
.pc .ti{width:15px;height:15px;color:var(--pool)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;width:100%;text-align:left;font-size:15px}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.toggle[aria-checked="true"] .sw{background:var(--pool)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px)}
.toggle small,.set-row small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;width:100%;text-align:left;font-size:15px}
.set-row .r{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.set-row input[type=time]{border:0;background:var(--surface-2);border-radius:10px;height:36px;padding:0 10px;font-family:var(--num);font-variant-numeric:tabular-nums}
.set-row.col{flex-direction:column;align-items:stretch}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw-btn{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.sw-btn i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line)}
.sw-btn.on{color:var(--ink);font-weight:600}
.sw-btn.on i{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.about{display:flex;gap:14px;align-items:center}
.about svg{width:56px;height:56px;border-radius:14px;flex:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));width:max-content;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:80;background:var(--ink);color:var(--paper);border-radius:16px;padding:11px 8px 11px 16px;font-size:14px;display:flex;align-items:center;gap:12px;transition:opacity .25s,transform .25s var(--ease);max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--celadon);font-weight:600;padding:2px 8px;white-space:nowrap;flex:none}
html[data-mode="light"] .toast button{color:var(--celadon)}
.toast:not(.has-act){padding-right:16px}

/* onboarding */
.ob{position:fixed;inset:0;z-index:70;background:var(--paper);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(28px + env(safe-area-inset-bottom))}
.ob-in{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ob .mark{width:88px;height:88px;border-radius:22px;box-shadow:0 14px 30px -14px var(--shade)}
.ob h1{font-family:var(--kai);font-size:34px;font-weight:700;margin-top:22px;letter-spacing:.03em}
.ob h2{font-family:var(--kai);font-size:26px;font-weight:700;line-height:1.3}
.ob .lead{font-size:16px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.ob-pts{margin:28px 0 8px;display:flex;flex-direction:column;gap:16px}
.ob-pts div{display:flex;gap:14px;align-items:flex-start}
.ob-pts .ico{width:42px;height:42px}
.ob-pts b{display:block;font-size:15px;font-weight:600}
.ob-pts span{font-size:13px;color:var(--ink-2)}
.ob-foot{margin-top:auto;padding-top:24px}
.ob-step{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.tpl{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.tpl button{display:block;text-align:left;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.tpl button.on{border-color:var(--pool);box-shadow:0 0 0 1px var(--pool)}
.tpl b{display:block;font-size:16px;font-weight:600}
.tpl .s{display:block}
.tpl .s{font-size:13px;color:var(--ink-2);margin:2px 0 10px}
.tpl .ribbon{height:18px;border-radius:7px}
.tpl .ribbon i{top:3px;bottom:3px;border-radius:3px}
.tpl .blank .ribbon{display:none}
.tpl .blank .s{margin-bottom:0}

/* 今日一句 */
.qt{display:block;width:100%;text-align:left;margin:0 0 14px;padding:14px 16px 13px;border-radius:20px;background:color-mix(in srgb,var(--gold-soft) 55%,var(--surface));transition:transform .15s}
.qt:active{transform:scale(.99)}
.qt .q1{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--kai);font-size:17px;line-height:1.55;color:var(--ink)}
.qt .q2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:4px}
.qt .q3{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.dawn{position:fixed;inset:0;z-index:66;background:var(--paper);overflow:hidden auto;opacity:0;transition:opacity .45s}
.dawn.in{opacity:1}
.dawn-in{max-width:560px;min-height:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 32px calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;justify-content:center}
.dawn-q .q1{font-family:var(--kai);font-size:clamp(26px,7.6vw,36px);line-height:1.6;letter-spacing:.02em;color:var(--ink);text-wrap:balance}
.dawn-q .q1[lang="en"]{letter-spacing:0;line-height:1.5}
.dawn-q .q1[lang="zh-Hant"]{text-wrap:pretty}
.dawn-q .q2{font-size:16px;line-height:1.75;color:var(--ink-2);margin-top:22px;text-wrap:balance}
.dawn-q footer{font-size:13px;color:var(--ink-3);margin-top:26px}
.dawn-go{position:fixed;right:max(24px,calc(50% - 256px));bottom:calc(env(safe-area-inset-bottom) + 32px);width:60px;height:60px;border-radius:50%;background:var(--pool);color:var(--pool-ink);display:grid;place-items:center;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--pool) 70%,transparent);transition:transform .15s}
.dawn-go .ti{width:28px;height:28px;stroke-width:2.2}
.dawn-go:active{transform:scale(.92)}
.dawn.in .dawn-q > *{animation:rise .9s var(--ease) both}
.dawn.in .dawn-q > :nth-child(2){animation-delay:.18s} .dawn.in .dawn-q > :nth-child(3){animation-delay:.32s}
.dawn.in .dawn-go{animation:rise .9s var(--ease) .45s both}
/* 點英文單字看解釋；朗讀 */
.dawn-q .wc{white-space:nowrap}
.dawn-q .w{font:inherit;color:inherit;letter-spacing:inherit;padding:0;border-radius:4px;cursor:pointer;transition:background-color .15s,color .15s;-webkit-tap-highlight-color:transparent}
.dawn-q .w:hover,.dawn-q .w.on{background:color-mix(in srgb,var(--pool) 16%,transparent)}
.dawn-q .w.speaking{background:var(--pool);color:var(--pool-ink)}
.dawn-tools{position:fixed;left:max(24px,calc(50% - 256px));bottom:calc(env(safe-area-inset-bottom) + 40px);display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 120px)}
.dawn.in .dawn-tools{animation:rise .9s var(--ease) .55s both}
.sayb{display:inline-grid;place-items:center;width:48px;height:48px;padding:0;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap}
.sayb .ti{width:22px;height:22px;color:var(--pool)}
.sayb.on{background:var(--pool);border-color:var(--pool);color:var(--pool-ink)}
.sayb.on .ti{color:var(--pool-ink)}
.dawn-hint{font-size:12px;color:var(--ink-3);margin-top:14px}
.wpop{position:fixed;z-index:90;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:0 18px 40px -16px var(--shade);animation:rise .25s var(--ease) both}
.wpop .wp-top{display:flex;align-items:center;gap:10px}
.wpop .wp-top b{font-size:20px;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
.wpop .ipa{font-family:var(--num);font-size:13px;color:var(--ink-3)}
.wpop .wp-say{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pool);color:var(--pool-ink);display:grid;place-items:center}
.wpop .wp-say .ti{width:20px;height:20px}
.wpop .wp-zh{font-size:16px;color:var(--ink);margin-top:8px;line-height:1.5}
.wpop .wp-en{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.wpop .wp-base{font-size:12px;color:var(--ink-3);margin-top:2px}
/* 設定的滑桿 */
.slider{display:flex;flex-direction:column;gap:6px;padding:14px 16px 12px}
.slider .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:15px}
.slider .top small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.slider output{font-family:var(--num);font-weight:650;font-size:16px;color:var(--pool);font-variant-numeric:tabular-nums;white-space:nowrap}
.slider .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-family:var(--num)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--pool) var(--p,50%),var(--surface-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--pool);margin-top:-10px;box-shadow:0 2px 6px -2px var(--shade)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--pool)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--pool)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--pool) 25%,transparent)}
/* 紀錄、安排留白 */
.rec-t{display:flex;gap:8px;align-items:center;font-size:17px;font-weight:600;margin:2px 2px 0}
.rec-t .ti{color:var(--pool)}
.chip.last{max-width:100%;overflow:hidden;text-overflow:ellipsis;height:auto;min-height:36px;padding:6px 13px;white-space:normal;text-align:left}
.gs-sub{font-size:14px;color:var(--ink-2);margin:0 2px 2px}
.field > span small{color:var(--ink-3);margin-left:4px}
.row.pick .mins{font-size:12px;color:var(--ink-2);white-space:nowrap}
.row.pick .pill{margin-left:0;flex:none}
.row.rec{align-items:flex-start}
.row.rec .when{flex:none;width:44px;font-size:13px;color:var(--ink-2);font-family:var(--num);font-variant-numeric:tabular-nums;padding-top:1px}
.row.rec .s.note{color:var(--ink-2);font-size:13px}
.row.rec .s.empty-note{color:var(--ink-3);font-style:normal}
.jd + .jd{margin-top:16px}
.jh{font-size:13px;color:var(--ink-2);font-weight:600;margin:0 4px 6px}
/* 目標：人生清單 → 核心 10 個 → 每週往前一步 → 今天的三件事 */
.steps ol{list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:650;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.steps li.now .n{background:var(--pool);color:var(--pool-ink)}
.steps li.ok .n{background:var(--pool-soft);color:var(--pool)}
.steps li.ok .n .ti{width:15px;height:15px;stroke-width:2.6}
.steps b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.steps span{font-size:12px;color:var(--ink-3)}
.steps li:not(.now):not(.ok) b{color:var(--ink-2);font-weight:500}
.vision .ask-q{display:block}
.vision .vtext{width:100%;min-height:84px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical;outline:none;margin-top:10px;font-family:var(--kai)}
.vision .vtext:focus{border-color:var(--pool)}
.star{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:color .15s,transform .15s}
.star .ti{width:22px;height:22px}
.star.on{color:var(--gold)}
.star.on .ti{fill:currentColor}
.star:active{transform:scale(.9)}
.it.reached .t{color:var(--gold)}
.g50{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.g50 i{display:block;height:100%;background:var(--pool);border-radius:9px;transition:width .5s var(--ease)}
.g-prompt{font-size:13px;color:var(--ink-2);margin:10px 2px 10px;min-height:20px}
.gc + .gc{border-top:1px solid var(--line)}
.gc > .row .ico{background:var(--gold-soft);color:var(--gold)}
.gc > .row .ico .ti{fill:currentColor}
.gc .acts{padding:0 8px 8px 52px}
.gc .acts .it-row{padding:6px 8px}
.gc .acts .ck{width:24px;height:24px}
.gc .acts .t{font-size:14px}
.top3{margin-top:12px;padding:14px 12px 8px}
.t3-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 6px}
.t3-h small{font-size:12px;color:var(--ink-3)}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px dashed var(--line);color:var(--ink-3);font-size:14px;margin:4px 0}
.slot .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--num);font-weight:650;font-size:12px;color:var(--ink-2);flex:none}
.slot:hover{border-color:color-mix(in srgb,var(--pool) 50%,var(--line));color:var(--pool)}
.t3 .it-row{padding:8px 4px 8px 12px}
.t3 .rm{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.t3 .rm .ti{width:16px;height:16px}
.gtag{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:600}
.pick-h{font-size:13px;color:var(--ink-2);font-weight:600;margin:16px 4px 6px}
.week-g{margin-top:14px}
.week-g h4{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;margin:0 4px 8px}
.week-g h4 .ti{width:17px;height:17px;color:var(--gold);fill:currentColor}
.week-g .rows{margin-bottom:8px}
input,select,textarea{font-size:max(16px,1em)}
input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0}
/* 下拉更新（與長流相同）：頂部浮出一顆小膠囊，拉過門檻放開就同步 */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:30;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(0,0,0,.35);font-size:13px;color:var(--ink-2);opacity:0;transform:translate(-50%,-60px);pointer-events:none}
.ptr.back{transition:transform .25s,opacity .25s}
.ptr-ic .ti{width:16px;height:16px;color:var(--pool)}
.ptr.spin .ptr-ic .ti{animation:ptr-spin 1s linear infinite}
@keyframes ptr-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ptr.spin .ptr-ic .ti{animation:none}}
html{overscroll-behavior:none;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
html,body{overflow-x:clip}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
@media (min-width:720px){ #app{padding-top:36px} }
</style>
</head>

</div></nav>

/* ── 抽屜 ────────────────────────────────── */

function pageDrawers() {

    + `<section class="panel"><div class="wkc">${axis}${cols}</div>

    + `<section class="block"><h2>${UI.wkSel ? `週${WD[UI.wkSel]}的抽屜` : '每個抽屜'}${UI.wkSel ? `<button class="lk" data-act="wk" data-w="${UI.wkSel}">顯示全部</button>` : `<small>點上面的星期可以只看那天</small>`}</h2>
      ${list.length ? groups.map(([l, i, f]) => { const xs = list.filter(f); return xs.length ? `<div class="dgroup"><h3>${ic(i)}${l}<small>${xs.length} 個</small></h3>${xs.map(drawerRow).join('')}</div>` : ''; }).join('')

/* ── 回顧 ────────────────────────────────── */
function weekDays(off) { const t = today(), mon = addDays(t, -(dow(t) - 1) + off * 7); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(mon, i)); }
function pageReview() {
  const days = weekDays(UI.rvWeek), t = today(), set = new Set(days), logs = live(D.logs).filter(l => set.has(l.d));
  const recs = live(D.recs).filter(r => set.has(r.d)).sort((a, b) => b.d.localeCompare(a.d) || b.at - a.at);
  const seg = `<span class="seg"><button class="${UI.rvWeek === 0 ? 'on' : ''}" data-act="rv" data-v="0">本週</button><button class="${UI.rvWeek === -1 ? 'on' : ''}" data-act="rv" data-v="-1">上週</button></span>`;
  const range = `${parseYmd(days[0]).getMonth() + 1}/${parseYmd(days[0]).getDate()}–${parseYmd(days[6]).getMonth() + 1}/${parseYmd(days[6]).getDate()}`;
  if (!logs.length && recs.length) return head('回顧', range, seg) + goalsReviewHTML(days) + journalHTML(recs);
  if (!logs.length) return head('回顧', range, seg) + goalsReviewHTML(days) + `<div class="panel empty" style="margin-top:20px"><div class="e-big">這週還沒有紀錄</div>每段時間結束後，「今天」頁會問一句：剛剛過得如何？<br>點一下就好。幾天後，這裡會告訴你時間都去哪了。</div>`;
  const tot = { plan: 0, rest: 0, other: 0, leak: 0 }, byDay = {}, hours = {};
  for (const l of logs) { const m = l.end - l.start; tot[l.kind] += m; (byDay[l.d] = byDay[l.d] || { plan: 0, rest: 0, other: 0, leak: 0 })[l.kind] += m;
    if (l.kind === 'leak') for (let h = Math.floor(l.start / 60); h * 60 < l.end; h++) hours[h] = (hours[h] || 0) + Math.min(l.end, (h + 1) * 60) - Math.max(l.start, h * 60); }
  const maxDay = Math.max(60, ...days.map(d => { const x = byDay[d]; return x ? x.plan + x.rest + x.other + x.leak : 0; }));
  const bars = days.map(d => { const x = byDay[d] || {}; const H = k => ((x[k] || 0) / maxDay * 100).toFixed(1);
    return `<div class="c${d === t ? ' today' : ''}"><div class="bar">${['plan', 'rest', 'other', 'leak'].map(k => x[k] ? `<i class="k-${k}-bg" style="height:${H(k)}%"></i>` : '').join('')}</div><span>${WD[dow(d)]}</span></div>`; }).join('');
  // 流失熱區
  const h0 = Math.floor(wakeM() / 60), h1 = Math.ceil(sleepM() / 60), hs = []; for (let h = h0; h < h1; h++) hs.push(h);
  const hMax = Math.max(1, ...hs.map(h => hours[h] || 0));
  let best = h0, bestV = -1; for (let h = h0; h < h1 - 1; h++) { const v = (hours[h] || 0) + (hours[h + 1] || 0); if (v > bestV) { bestV = v; best = h; } }
  // 抽屜守時
  const per = {}; for (const l of logs) if (l.dr) { const p = per[l.dr] = per[l.dr] || { plan: 0, all: 0 }; p.all += l.end - l.start; if (l.kind === 'plan') p.plan += l.end - l.start; }
  const drs = Object.keys(per).map(id => ({ dr: drawerById(id), ...per[id] })).filter(x => x.dr && !x.dr.del).sort((a, b) => b.plan / b.all - a.plan / a.all);
  // 做完的事、收抽屜連續天數
  let doneN = 0; for (const it of live(D.items)) { if (it.doneDates) for (const k in it.doneDates) if (set.has(k)) doneN++; if (it.doneOn && set.has(it.doneOn)) doneN++; }
  doneN = Math.max(doneN, recs.length);
  let streak = 0; for (let d = D.prefs.closed[t] ? t : addDays(t, -1); D.prefs.closed[d]; d = addDays(d, -1)) streak++;
  const drL = logs.filter(l => l.dr), drAll = drL.reduce((s, l) => s + l.end - l.start, 0);
  const keep = drAll ? Math.round(drL.filter(l => l.kind === 'plan').reduce((s, l) => s + l.end - l.start, 0) / drAll * 100) : 0;
  const dayScore = days.filter(d => byDay[d]).map(d => ({ d, leak: byDay[d].leak, plan: byDay[d].plan })).sort((a, b) => a.leak - b.leak || b.plan - a.plan);
  const ins = [];
  if (bestV > 0) ins.push(`${ic('clock')}最容易流失的時段是 <b class="num">${pad(best)}:00–${pad(best + 2)}:00</b>。在那裡放一個小抽屜，或先把手機放遠一點。`);
  if (tot.rest >= tot.leak) ins.push(`${ic('leaf')}用心留白比流失多，這是很好的節奏。`); else ins.push(`${ic('leaf')}流失比用心留白多 ${dur(tot.leak - tot.rest)}。下次空檔時，先看一眼留白清單。`);
  if (dayScore.length > 1) ins.push(`${ic('sparkles')}週${WD[dow(dayScore[0].d)]}最從容${dayScore[0].leak ? `，只流失 ${dur(dayScore[0].leak)}` : '，沒有流失'}。`);
  return head('回顧', range + (D.demo && logs.some(l => l.demo) ? ' · 含示範紀錄' : ''), seg)
    + `<section class="panel"><p class="say">這週有 <b class="k-rest">${dur(tot.rest)}</b> 是用心留白，<b class="k-leak">${dur(tot.leak)}</b> 不知不覺流失了。抽屜照計畫走了 <b class="k-plan">${keep}%</b>。</p>
      <div class="stat-line"><span class="chip">${ic('check')}做完 <b class="num">${doneN}</b> 件事</span>${streak ? `<span class="chip streak">${ic('moon')}連續收抽屜 <b class="num">${streak}</b> 天</span>` : ''}</div></section>`
    + goalsReviewHTML(days)
    + journalHTML(recs)
    + `<section class="block"><h2>每天的時間去哪了</h2><div class="panel"><div class="stack">${bars}</div>
      <div class="legend"><span><i class="k-plan-bg"></i>照計畫</span><span><i class="k-rest-bg"></i>用心留白</span><span><i class="k-other-bg"></i>做了別的</span><span><i class="k-leak-bg"></i>滑掉了</span></div></div></section>`
    + `<section class="block"><h2>流失熱區<small>每小時累計</small></h2><div class="panel"><div class="hours" style="grid-template-columns:repeat(${hs.length},1fr)">${hs.map(h => { const v = hours[h] || 0; return `<i title="${pad(h)}:00 流失 ${Math.round(v)} 分" style="background:${v ? `color-mix(in srgb,var(--vermilion) ${Math.round(18 + v / hMax * 82)}%,var(--surface-2))` : 'var(--surface-2)'}"></i>`; }).join('')}</div>
      <div class="hours-ax num"><span>${pad(h0)}:00</span><span>12:00</span><span>${pad(h1 % 24)}:00</span></div></div></section>`
    + (drs.length ? `<section class="block"><h2>抽屜守時</h2><div class="rows">${drs.map(x => { const p = Math.round(x.plan / x.all * 100);
        return `<div class="an-row" data-tone="${x.dr.tone}"><span class="ico">${ic(x.dr.icon)}</span><div class="mid"><div class="kv"><span>${esc(x.dr.name)}</span><span class="num" style="font-weight:600">${p}%</span></div><span class="an-track"><i style="width:${p}%"></i></span></div></div>`; }).join('')}</div></section>` : '')
    + `<section class="block"><h2>給下週的你</h2><div class="panel ins">${ins.map(x => `<p>${x}</p>`).join('')}</div></section>`;
}

function goalsReviewHTML(days) {

    if (a === 'done') {
      applyTemplate(S.tpl, S.wake, S.sleep); if (S.demo && TPL[S.tpl].d.length) seedDemo();
      ob.hidden = true; UI.tab = 'today'; UI.opened = false; UI.lastSeg = undefined; render(); UI.opened = true; UI.lastSeg = curSeg()?.key || 'none';
      UIP.dawn = quoteKey(); saveUI();
      return toast('櫃子排好了');
    }
    draw();
  };
  ob.onchange = e => { if (e.target.type === 'time') S.custom = true; };
  ob.hidden = false; draw();
}

/* ── boot ───────────────────────────────── */
applyTheme();
if (!D) showOnboarding();
else { migrate(); save(); rollOver(); render(); UI.opened = true; UI.lastSeg = curSeg()?.key || 'none'; showDawn(); }
setInterval(() => { if (!D) return; refreshLive(); checkNotify(); if (document.visibilityState === 'visible' && !Sync.dirty) Sync.run(); }, 20000);
if (Sync.ready()) Sync.run(); else Sync.set('off');
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) Sync.run(); if (document.visibilityState === 'visible' && D && !sheetOpen()) { rollOver(); UI.opened = true; render(); if ((UIP.dawn !== quoteKey() || Date.now() - HIDDEN_AT > 30 * 60000) && HIDDEN_AT && $('#ob').hidden && $('#dawn').hidden) showDawn(); } });
// 下拉更新（與長流相同）：任何頁面在最上方往下拉，放開後同步一次並重畫
(() => {
  let y0 = null, dy = 0, busy = false;
  const ind = document.createElement('div'); ind.className = 'ptr'; ind.innerHTML = `<span class="ptr-ic">${ic('refresh')}</span><span class="ptr-t">下拉更新</span>`;
  document.body.append(ind);
  const set = (h, txt) => { ind.style.transform = `translate(-50%, ${Math.min(h, 90) - 60}px)`; ind.style.opacity = Math.min(1, h / 70); if (txt) ind.querySelector('.ptr-t').textContent = txt; };
  document.addEventListener('touchstart', e => { y0 = D && !busy && !sheetOpen() && $('#dawn').hidden && $('#ob').hidden && window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0) { set(0); return; }
    ind.classList.remove('back'); set(dy * 0.6, dy * 0.6 > 70 ? '放開更新' : '下拉更新');
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if (y0 == null) return;
    const go = dy * 0.6 > 70; y0 = null;
    ind.classList.add('back');
    if (!go) { set(0); return; }
    busy = true; set(80, '更新中…'); ind.classList.add('spin');
    try { const ok = Sync.ready() ? await Sync.run(true) : true; rollOver(); if (!sheetOpen()) render(); toast(ok === false ? '同步暫時失敗，稍後再試' : '已更新'); }
    finally { busy = false; ind.classList.remove('spin'); set(0); }
  });
})();
let HIDDEN_AT = 0;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') HIDDEN_AT = Date.now(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
